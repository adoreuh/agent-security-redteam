[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-redteam"
version = "0.3.0"
description = "Agent security red-team harness for aicomp-sdk 3.1.2"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "aicomp-sdk>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"agent_security_redteam" = "."}
packages = ["agent_security_redteam"]
